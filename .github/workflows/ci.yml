name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy gemmi pyyaml pytest ruff
      - run: ruff check --select F proga/ttbio_oracle.py tests/test_ttbio_oracle.py
      - run: python -m compileall proga
      # Card-free oracle tests. The full suite (tests/test_design.py scoring) needs the optional
      # protenix GPU extra: `pip install -e .[protenix]` on a CUDA box.
      - run: PYTHONPATH=. pytest tests/test_ttbio_oracle.py -q
