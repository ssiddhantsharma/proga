name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy gemmi pyyaml pytest ruff
      - run: ruff check .
      - run: python -m compileall proga
      # Card-free tests: the oracle parsers and the core selection math (scoring). The rest of
      # tests/test_design.py needs the optional protenix GPU extra (`pip install -e .[protenix]`).
      - run: PYTHONPATH=. pytest tests/test_ttbio_oracle.py tests/test_nesso1_oracle.py tests/test_scoring.py -q
